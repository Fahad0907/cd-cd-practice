name: Deploy Django App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to Private EC2
        run: |
          ssh ubuntu@52.90.3.101 << 'EOF'

            cd cd-cd-practice

            git pull origin main

          EOF

      - name: Notify Success
        run: echo "Deployment Successful!"
