name: Deploy Django App

on:
  push:
    branches:
      - main

jobs:
  # =========================
  # 1. TEST JOB (CI GATE)
  # =========================
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          pytest -x --disable-warnings --maxfail=1


  # =========================
  # 2. DEPLOY JOB
  # =========================
  deploy:
    needs: test   # 👈 IMPORTANT: only runs if tests pass
    runs-on: self-hosted

    steps:
      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@52.90.3.101 << 'EOF'

            cd cd-cd-practice

            git pull origin main

          EOF

      - name: Notify Success
        run: echo "Deployment Successful!"